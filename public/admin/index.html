<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yunayu CMS</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <!-- tempat CMS muncul -->
    <div id="nc-root"></div>

    <script>
      window.CMS_MANUAL_INIT = true;

      // Tunggu sampai CMS ready
      function waitForCMSInit() {
        if (window.CMS && typeof window.CMS.init === "function") {
          console.log("🎉 CMS siap, gas init!");
          window.CMS.init({
            backend: {
              name: "git-gateway",
              branch: "main",
            },
            media_folder: "public/uploads",
            public_folder: "/uploads",
            media_library: {
              name: "default",
            },
            collections: [
              {
                name: "about",
                label: "About Page",
                files: [
                  {
                    label: "About Page Content",
                    name: "about",
                    file: "content/about.json",
                    fields: [
                      {
                        label: "Intro",
                        name: "intro",
                        widget: "object",
                        fields: [
                          { label: "Title", name: "title", widget: "string" },
                          {
                            label: "Description",
                            name: "description",
                            widget: "text",
                          },
                        ],
                      },
                      {
                        label: "Yunayu",
                        name: "yunayu",
                        widget: "object",
                        fields: [
                          { label: "Title", name: "title", widget: "string" },
                          {
                            label: "Description",
                            name: "description",
                            widget: "text",
                          },
                          {
                            label: "Facts",
                            name: "facts",
                            widget: "object",
                            fields: [
                              {
                                label: "Fun Fact",
                                name: "funFact",
                                widget: "string",
                              },
                              {
                                label: "Dream",
                                name: "dream",
                                widget: "string",
                              },
                              {
                                label: "Ambition",
                                name: "ambition",
                                widget: "string",
                              },
                            ],
                          },
                          { label: "Image", name: "image", widget: "image" },
                        ],
                      },
                      {
                        label: "Yunation",
                        name: "yunation",
                        widget: "object",
                        fields: [
                          { label: "Title", name: "title", widget: "string" },
                          {
                            label: "Description",
                            name: "description",
                            widget: "text",
                          },
                        ],
                      },
                      {
                        label: "Website Info",
                        name: "website",
                        widget: "object",
                        fields: [
                          { label: "Title", name: "title", widget: "string" },
                          {
                            label: "Description",
                            name: "description",
                            widget: "text",
                          },
                        ],
                      },
                      {
                        label: "Coder Info",
                        name: "coder",
                        widget: "object",
                        fields: [
                          { label: "Title", name: "title", widget: "string" },
                          {
                            label: "Description",
                            name: "description",
                            widget: "text",
                          },
                          { label: "Image", name: "image", widget: "image" },
                          {
                            label: "Portfolio Link",
                            name: "portfolioLink",
                            widget: "string",
                          },
                        ],
                      },
                      {
                        label: "Contributors",
                        name: "contributors",
                        widget: "list",
                        fields: [
                          {
                            label: "Username",
                            name: "username",
                            widget: "string",
                          },
                          {
                            label: "Role",
                            name: "role",
                            widget: "string",
                          },
                        ],
                      },
                    ],
                  },
                ],
              },
            ],
          });
        } else {
          // CMS belum siap? coba lagi 200ms
          setTimeout(waitForCMSInit, 200);
        }
      }

      // Mulai nunggu CMS siap
      document.addEventListener("DOMContentLoaded", waitForCMSInit);
    </script>
  </body>
</html>
