<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yunayu CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <!-- CMS container -->
    <div id="nc-root"></div>

    <!-- Manual init -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- Load CMS core & media library -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.1/dist/decap-cms.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.1/dist/decap-cms-media-library-uploadcare.js"></script>

    <!-- CMS config & init -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const CMS = window.CMS;

        // Daftarin media library (uploadcare)
        if (window.Uploadcare) {
          CMS.registerMediaLibrary(window.Uploadcare);
        }

        // Init DecapCMS
        CMS.init({
          backend: {
            name: "git-gateway",
            branch: "main",
          },
          media_folder: "public/uploads",
          public_folder: "/uploads",
          media_library: {
            name: "uploadcare",
          },
          collections: [
            {
              name: "about",
              label: "About Page",
              files: [
                {
                  label: "About Page Content",
                  name: "about",
                  file: "content/about.json",
                  fields: [
                    {
                      label: "Intro",
                      name: "intro",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                      ],
                    },
                    {
                      label: "Yunayu",
                      name: "yunayu",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                        {
                          label: "Facts",
                          name: "facts",
                          widget: "object",
                          fields: [
                            {
                              label: "Fun Fact",
                              name: "funFact",
                              widget: "string",
                            },
                            { label: "Dream", name: "dream", widget: "string" },
                            {
                              label: "Ambition",
                              name: "ambition",
                              widget: "string",
                            },
                          ],
                        },
                        { label: "Image", name: "image", widget: "image" },
                      ],
                    },
                    {
                      label: "Yunation",
                      name: "yunation",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                      ],
                    },
                    {
                      label: "Website Info",
                      name: "website",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                      ],
                    },
                    {
                      label: "Coder Info",
                      name: "coder",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                        { label: "Image", name: "image", widget: "image" },
                        {
                          label: "Portfolio Link",
                          name: "portfolioLink",
                          widget: "string",
                        },
                      ],
                    },
                    {
                      label: "Contributors",
                      name: "contributors",
                      widget: "list",
                      fields: [
                        {
                          label: "Username",
                          name: "username",
                          widget: "string",
                        },
                        { label: "Role", name: "role", widget: "string" },
                      ],
                    },
                  ],
                },
              ],
            },
          ],
        });
      });
    </script>
  </body>
</html>
