<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Yunayu CMS</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <!-- container buat CMS -->
    <div id="nc-root"></div>

    <!-- inisialisasi CMS pas semuanya udah siap -->
    <script type="module">
      window.CMS_MANUAL_INIT = true;

      document.addEventListener("DOMContentLoaded", () => {
        if (!window.CMS) {
          console.error("CMS belum siap!");
          return;
        }

        window.CMS.init({
          backend: {
            name: "git-gateway",
            branch: "main",
          },
          media_folder: "public/uploads",
          public_folder: "/uploads",
          media_library: {
            name: "default",
          },
          collections: [
            {
              name: "about",
              label: "About Page",
              files: [
                {
                  label: "About Page Content",
                  name: "about",
                  file: "content/about.json",
                  fields: [
                    {
                      label: "Intro",
                      name: "intro",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                      ],
                    },
                    {
                      label: "Yunayu",
                      name: "yunayu",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                        {
                          label: "Facts",
                          name: "facts",
                          widget: "object",
                          fields: [
                            {
                              label: "Fun Fact",
                              name: "funFact",
                              widget: "string",
                            },
                            { label: "Dream", name: "dream", widget: "string" },
                            {
                              label: "Ambition",
                              name: "ambition",
                              widget: "string",
                            },
                          ],
                        },
                        { label: "Image", name: "image", widget: "image" },
                      ],
                    },
                    {
                      label: "Yunation",
                      name: "yunation",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                      ],
                    },
                    {
                      label: "Website Info",
                      name: "website",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                      ],
                    },
                    {
                      label: "Coder Info",
                      name: "coder",
                      widget: "object",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        },
                        { label: "Image", name: "image", widget: "image" },
                        {
                          label: "Portfolio Link",
                          name: "portfolioLink",
                          widget: "string",
                        },
                      ],
                    },
                    {
                      label: "Contributors",
                      name: "contributors",
                      widget: "list",
                      fields: [
                        {
                          label: "Username",
                          name: "username",
                          widget: "string",
                        },
                        { label: "Role", name: "role", widget: "string" },
                      ],
                    },
                  ],
                },
              ],
            },
          ],
        });
      });
    </script>
  </body>
</html>
